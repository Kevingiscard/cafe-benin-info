<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Altitude : robusta et arabica ne jouent pas sur le même terrain</title><desc id="desc">Le robusta se cultive du niveau de la mer à environ 800 mètres. L'arabica donne de meilleurs résultats en altitude, souvent en zone vallonnée.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="90" width="500" height="220" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="320" y="150" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle">Robusta</text><text x="320" y="200" font-size="13" fill="#63706a" text-anchor="middle">du niveau de la mer</text><text x="320" y="224" font-size="13" fill="#63706a" text-anchor="middle">à environ 800 m</text><rect x="630" y="60" width="500" height="250" rx="18" fill="#294b3b"/><text x="880" y="122" font-size="17" fill="#fffaf2" font-weight="700" text-anchor="middle">Arabica</text><text x="880" y="172" font-size="13" fill="#f4eee4" text-anchor="middle">de meilleurs résultats en altitude,</text><text x="880" y="196" font-size="13" fill="#f4eee4" text-anchor="middle">souvent en zone vallonnée</text></g><text x="600" y="356" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Repères du manuel FAO de culture du café.</text></svg>
