<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#3b1d10"/><stop offset="1" stop-color="#b65b2a"/></linearGradient></defs><rect width="1200" height="700" fill="#0d0b09"/><g font-family="DM Sans,Arial,sans-serif" fill="#f6f0e7"><text x="70" y="80" font-size="42" font-weight="700">Anatomie d’une cerise de café</text><text x="70" y="120" fill="#a69e93" font-size="20">De la peau jusqu’aux graines : ce qui devient le café vert.</text></g><g transform="translate(120 190)"><ellipse cx="300" cy="210" rx="205" ry="240" fill="url(#g)"/><ellipse cx="300" cy="210" rx="155" ry="190" fill="#7f351c"/><path d="M300 25 C350 120 350 300 300 395 C250 300 250 120 300 25Z" fill="#a94f27"/><ellipse cx="300" cy="210" rx="75" ry="150" fill="#efe2cf"/><path d="M300 70 C350 150 350 270 300 350 C250 270 250 150 300 70Z" fill="#d5c2a8"/></g><g font-family="DM Sans,Arial,sans-serif" font-size="22" fill="#f6f0e7"><path d="M510 145 H760" stroke="#d58a4d" stroke-width="2"/><text x="780" y="153">Peau</text><path d="M500 225 H760" stroke="#d58a4d" stroke-width="2"/><text x="780" y="233">Pulpe / mucilage</text><path d="M480 315 H760" stroke="#d58a4d" stroke-width="2"/><text x="780" y="323">Parche</text><path d="M475 405 H760" stroke="#d58a4d" stroke-width="2"/><text x="780" y="413">Pellicule argentée</text><path d="M475 470 H760" stroke="#d58a4d" stroke-width="2"/><text x="780" y="478">Deux graines : les « grains »</text></g><g fill="#a69e93" font-family="DM Sans,Arial,sans-serif" font-size="18"><text x="70" y="610">Après traitement, séchage et déparchage, les graines deviennent le café vert.</text><text x="70" y="642">Source pédagogique : FAO, définition du café vert.</text></g></svg>