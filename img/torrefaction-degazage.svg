<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Repos et dégazage après la torréfaction</title><desc id="desc">La torréfaction forme des gaz, dont une grande part de dioxyde de carbone : une partie est libérée pendant la torréfaction, une partie reste piégée dans la structure poreuse du grain. Une étude de torréfacteur sur 21 cafés indique qu'un repos de 24 heures peut ne pas suffire pour atteindre la qualité maximale.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><ellipse cx="270" cy="200" rx="120" ry="150" fill="#9c5b35"/><ellipse cx="270" cy="200" rx="120" ry="150" fill="none" stroke="#294b3b" stroke-width="3"/><path d="M270 60 Q240 200 270 340" stroke="#f4eee4" stroke-width="5" fill="none"/><text x="270" y="380" font-size="13" fill="#63706a" text-anchor="middle">structure poreuse du grain</text><g><circle cx="450" cy="120" r="9" fill="#63706a"/><circle cx="500" cy="90" r="7" fill="#63706a"/><circle cx="480" cy="160" r="6" fill="#63706a"/><text x="470" y="60" font-size="13.5" fill="#63706a">gaz libérés pendant</text><text x="470" y="80" font-size="13.5" fill="#63706a">la torréfaction</text></g><g><circle cx="330" cy="150" r="8" fill="#294b3b"/><circle cx="350" cy="220" r="7" fill="#294b3b"/><circle cx="315" cy="270" r="6" fill="#294b3b"/><text x="430" y="240" font-size="13.5" fill="#63706a">une partie reste piégée :</text><text x="430" y="262" font-size="13.5" fill="#63706a">grande part de CO2</text></g><rect x="640" y="90" width="490" height="220" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="885" y="140" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle">Le repos compte</text><text x="885" y="186" font-size="14" fill="#63706a" text-anchor="middle">Une étude de torréfacteur sur 21 cafés :</text><text x="885" y="212" font-size="14" fill="#63706a" text-anchor="middle">24 h de repos peuvent ne pas suffire</text><text x="885" y="238" font-size="14" fill="#63706a" text-anchor="middle">pour atteindre la qualité maximale.</text><text x="885" y="284" font-size="12" fill="#9c5b35" text-anchor="middle">(valable pour ses conditions d'essai)</text></g></svg>
