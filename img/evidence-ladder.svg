<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Échelle de lecture des preuves</title><desc id="desc">Quatre niveaux : source primaire, source institutionnelle, relais secondaire et hypothèse à vérifier.</desc><rect width="900" height="520" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><g fill="#294b3b" font-size="28" font-weight="700"><text x="65" y="64">Plus solide pour affirmer</text><text x="65" y="477">Plus utile pour formuler une piste</text></g><g stroke="#fffaf2" stroke-width="6"><path fill="#294b3b" d="M70 100h760v72H70z"/><path fill="#496e5a" d="M140 172h690v72H140z"/><path fill="#c17b45" d="M210 244h620v72H210z"/><path fill="#d2a477" d="M280 316h550v72H280z"/></g><g fill="#fffaf2" font-size="24" font-weight="700"><text x="450" y="146" text-anchor="middle">1 · Donnée primaire archivée</text><text x="485" y="218" text-anchor="middle">2 · Institution / norme / étude</text><text x="520" y="290" text-anchor="middle">3 · Relais secondaire à contrôler</text><text x="555" y="362" text-anchor="middle">4 · Hypothèse ou sujet à documenter</text></g><g fill="#9c5b35" font-size="18"><text x="70" y="430">Toujours afficher l’année, l’unité, le périmètre et la date de consultation.</text></g></g></svg>
