<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Récolte : quatre systèmes reconnus par le Codex</title><desc id="desc">Le code d'usages du Codex distingue quatre systèmes de récolte : égrappage en un passage, égrappage en plusieurs passages, cueillette sélective en plusieurs passages et récolte mécanique. Pour une bonne qualité, les cerises sont cueillies une à une, seulement mûres, le plus souvent à la main.</desc><rect width="1200" height="430" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="245" height="215" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="192" cy="112" r="22" fill="#294b3b"/><text x="192" y="120" font-size="17" fill="#fffaf2" font-weight="700" text-anchor="middle">1</text><text x="192" y="160" font-size="14" fill="#294b3b" font-weight="700" text-anchor="middle">Égrappage</text><text x="192" y="182" font-size="14" fill="#294b3b" font-weight="700" text-anchor="middle">en un passage</text><text x="192" y="212" font-size="12" fill="#63706a" text-anchor="middle">toutes les cerises d'un coup</text><rect x="340" y="70" width="245" height="215" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="462" cy="112" r="22" fill="#294b3b"/><text x="462" y="120" font-size="17" fill="#fffaf2" font-weight="700" text-anchor="middle">2</text><text x="462" y="160" font-size="14" fill="#294b3b" font-weight="700" text-anchor="middle">Égrappage</text><text x="462" y="182" font-size="14" fill="#294b3b" font-weight="700" text-anchor="middle">en plusieurs passages</text><text x="462" y="212" font-size="12" fill="#63706a" text-anchor="middle">même geste, plusieurs fois</text><rect x="610" y="70" width="245" height="215" rx="18" fill="#294b3b"/><circle cx="732" cy="112" r="22" fill="#9c5b35"/><text x="732" y="120" font-size="17" fill="#fffaf2" font-weight="700" text-anchor="middle">3</text><text x="732" y="160" font-size="14" fill="#fffaf2" font-weight="700" text-anchor="middle">Cueillette sélective</text><text x="732" y="182" font-size="14" fill="#fffaf2" font-weight="700" text-anchor="middle">en plusieurs passages</text><text x="732" y="212" font-size="12" fill="#f4eee4" text-anchor="middle">cerises mûres, une à une :</text><text x="732" y="232" font-size="12" fill="#f4eee4" text-anchor="middle">la voie de la qualité</text><rect x="880" y="70" width="250" height="215" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="1005" cy="112" r="22" fill="#294b3b"/><text x="1005" y="120" font-size="17" fill="#fffaf2" font-weight="700" text-anchor="middle">4</text><text x="1005" y="160" font-size="14" fill="#294b3b" font-weight="700" text-anchor="middle">Récolte mécanique</text><text x="1005" y="212" font-size="12" fill="#63706a" text-anchor="middle">par machine</text><rect x="70" y="315" width="1060" height="62" rx="14" fill="#294b3b"/><text x="600" y="352" font-size="13" fill="#f4eee4" text-anchor="middle">Dans la grande majorité des pays producteurs, la cueillette se fait à la main.</text></g><text x="600" y="406" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Sources : manuel FAO sur la récolte ; code d'usages du Codex Alimentarius.</text></svg>
