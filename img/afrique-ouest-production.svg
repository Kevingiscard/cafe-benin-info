<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Production de café vert en Afrique de l’Ouest, 2024</title><desc id="desc">Graphique en barres : Guinée 174 847 tonnes, Côte d’Ivoire 72 133, Togo 21 769, Sierra Leone 2 208, Nigeria 1 809, Ghana 736, Liberia 653, Bénin 55, données FAOSTAT avec drapeaux.</desc><rect width="1200" height="510" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><text x="70" y="58" font-size="17" fill="#294b3b" font-weight="700" text-anchor="start" >Production de café vert en 2024 (tonnes) — FAOSTAT, avec drapeaux</text><text x="70" y="110" font-size="14.5" fill="#294b3b" font-weight="400" text-anchor="start" >Guinée</text><rect x="260" y="84" width="620" height="34" rx="10" fill="#9c5b35"/><text x="900" y="108" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >174 847 t (I)</text><text x="70" y="158" font-size="14.5" fill="#294b3b" font-weight="400" text-anchor="start" >Côte d’Ivoire</text><rect x="260" y="132" width="255" height="34" rx="10" fill="#9c5b35"/><text x="535" y="156" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >72 133 t (A)</text><text x="70" y="206" font-size="14.5" fill="#294b3b" font-weight="400" text-anchor="start" >Togo</text><rect x="260" y="180" width="77" height="34" rx="10" fill="#9c5b35"/><text x="357" y="204" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >21 769 t (I)</text><text x="70" y="254" font-size="14.5" fill="#294b3b" font-weight="400" text-anchor="start" >Sierra Leone</text><rect x="260" y="228" width="7" height="34" rx="10" fill="#9c5b35"/><text x="287" y="252" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >2 208 t (I)</text><text x="70" y="302" font-size="14.5" fill="#294b3b" font-weight="400" text-anchor="start" >Nigeria</text><rect x="260" y="276" width="6" height="34" rx="10" fill="#9c5b35"/><text x="286" y="300" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >1 809 t (E)</text><text x="70" y="350" font-size="14.5" fill="#294b3b" font-weight="400" text-anchor="start" >Ghana</text><rect x="260" y="324" width="4" height="34" rx="10" fill="#9c5b35"/><text x="284" y="348" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >736 t (E)</text><text x="70" y="398" font-size="14.5" fill="#294b3b" font-weight="400" text-anchor="start" >Liberia</text><rect x="260" y="372" width="4" height="34" rx="10" fill="#9c5b35"/><text x="284" y="396" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >653 t (I)</text><text x="70" y="446" font-size="14.5" fill="#294b3b" font-weight="700" text-anchor="start" >Bénin</text><rect x="260" y="420" width="4" height="34" rx="10" fill="#496e5a"/><text x="284" y="444" font-size="13.5" fill="#63706a" font-weight="700" text-anchor="start" >55 t (E)</text><text x="70" y="486" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="start" >Barres à l’échelle linéaire. A = chiffre officiel · I = valeur imputée · E = valeur estimée — les valeurs estimées ou imputées ne sont pas des mesures nationales.</text></g></svg>
