<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Le poids de l'Afrique dans le café mondial recule depuis les années 1970</title><desc id="desc">Part de l'Afrique dans les exportations mondiales de café : 31 pour cent en moyenne dans les années 1970, 24,4 pour cent dans les années 1980, 19,1 pour cent dans les années 1990, puis 11,4 pour cent de la valeur mondiale des exportations de café vert en 2013. En 2025/26, le continent produit 25,0 millions de sacs de 60 kg, en consomme 13,4 millions et en exporte 17,9 millions, en baisse de 6,7 pour cent sur un an.</desc><rect width="1200" height="460" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><text x="70" y="58" font-size="14" fill="#294b3b" font-weight="700">Part de l'Afrique dans les exportations mondiales de café</text><text x="70" y="112" font-size="12.5" fill="#294b3b">années 1970</text><rect x="230" y="96" width="620" height="24" rx="8" fill="#294b3b"/><text x="862" y="114" font-size="13" fill="#294b3b" font-weight="700">31 %</text><text x="70" y="154" font-size="12.5" fill="#294b3b">années 1980</text><rect x="230" y="138" width="488" height="24" rx="8" fill="#294b3b"/><text x="730" y="156" font-size="13" fill="#294b3b" font-weight="700">24,4 %</text><text x="70" y="196" font-size="12.5" fill="#294b3b">années 1990</text><rect x="230" y="180" width="382" height="24" rx="8" fill="#294b3b"/><text x="624" y="198" font-size="13" fill="#294b3b" font-weight="700">19,1 %</text><text x="70" y="238" font-size="12.5" fill="#294b3b">2013 (valeur)</text><rect x="230" y="222" width="228" height="24" rx="8" fill="#9c5b35"/><text x="470" y="240" font-size="13" fill="#9c5b35" font-weight="700">11,4 %</text><text x="230" y="272" font-size="11.5" fill="#63706a">Moyennes par décennie en volume ; 2013 en part de la valeur mondiale du café vert exporté.</text><rect x="70" y="296" width="340" height="110" rx="14" fill="#294b3b"/><text x="240" y="336" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">25,0 M de sacs</text><text x="240" y="364" font-size="12" fill="#f4eee4" text-anchor="middle">produits en 2025/26</text><text x="240" y="386" font-size="12" fill="#f4eee4" text-anchor="middle">(23,9 M en 2024/25)</text><rect x="430" y="296" width="340" height="110" rx="14" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="600" y="336" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">13,4 M de sacs</text><text x="600" y="364" font-size="12" fill="#63706a" text-anchor="middle">consommés en Afrique</text><text x="600" y="386" font-size="12" fill="#63706a" text-anchor="middle">en 2025/26</text><rect x="790" y="296" width="340" height="110" rx="14" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="960" y="336" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">17,9 M de sacs</text><text x="960" y="364" font-size="12" fill="#63706a" text-anchor="middle">exportés en 2025/26,</text><text x="960" y="386" font-size="12" fill="#63706a" text-anchor="middle">en baisse de 6,7 % sur un an</text></g><text x="600" y="442" font-family="Arial, sans-serif" font-size="12.5" fill="#63706a" text-anchor="middle">Sources : OIC, rapport de 2015 sur le café en Afrique ; rapport mensuel OIC d'octobre 2026.</text></svg>
