<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Moka : le monopole yéménite jusqu'à la fin du XVIIe siècle</title><desc id="desc">Jusqu'à la fin du XVIIe siècle, la production et la distribution du café restent concentrées au Yémen et au port de Moka. Les noms Mocha et Java désignent à l'origine des cafés vendus depuis les ports qui les portent.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="520" height="240" rx="18" fill="#294b3b"/><text x="330" y="140" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">Jusqu'à la fin du XVIIe siècle</text><text x="330" y="195" font-size="13" fill="#f4eee4" text-anchor="middle">production et distribution du café</text><text x="330" y="219" font-size="13" fill="#f4eee4" text-anchor="middle">concentrées au Yémen,</text><text x="330" y="243" font-size="13" fill="#f4eee4" text-anchor="middle">autour du port de Moka</text><rect x="630" y="80" width="500" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="880" y="135" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Un héritage dans le langage</text><text x="880" y="185" font-size="13" fill="#63706a" text-anchor="middle">« Mocha » et « Java » désignent à l'origine</text><text x="880" y="207" font-size="13" fill="#63706a" text-anchor="middle">des cafés vendus depuis les ports</text><text x="880" y="229" font-size="13" fill="#63706a" text-anchor="middle">qui portent ces noms</text></g><text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Source : synthèse historique universitaire sur le café.</text></svg>
