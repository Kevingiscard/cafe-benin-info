<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Producteurs africains : production 2025/26 selon l'USDA</title><desc id="desc">Production totale en milliers de sacs de 60 kg, estimation USDA de juillet 2026 pour 2025/26 : Éthiopie 11 560 ; Ouganda 7 095 ; Tanzanie 1 450 ; Côte d'Ivoire 1 300 ; Kenya 850. L'USDA prévoit un record éthiopien de 12,1 millions de sacs en 2026/27.</desc><rect width="1200" height="460" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><text x="70" y="58" font-size="14" fill="#294b3b" font-weight="700">Production 2025/26, estimation USDA (milliers de sacs de 60 kg)</text><text x="70" y="116" font-size="13" fill="#294b3b">Éthiopie</text><rect x="250" y="100" width="700" height="28" rx="8" fill="#294b3b"/><text x="962" y="120" font-size="13" fill="#294b3b" font-weight="700">11 560</text><text x="70" y="164" font-size="13" fill="#294b3b">Ouganda</text><rect x="250" y="148" width="430" height="28" rx="8" fill="#294b3b"/><text x="692" y="168" font-size="13" fill="#294b3b" font-weight="700">7 095</text><text x="70" y="212" font-size="13" fill="#294b3b">Tanzanie</text><rect x="250" y="196" width="88" height="28" rx="8" fill="#9c5b35"/><text x="350" y="216" font-size="13" fill="#294b3b" font-weight="700">1 450</text><text x="70" y="260" font-size="13" fill="#294b3b">Côte d'Ivoire</text><rect x="250" y="244" width="79" height="28" rx="8" fill="#9c5b35"/><text x="341" y="264" font-size="13" fill="#294b3b" font-weight="700">1 300</text><text x="70" y="308" font-size="13" fill="#294b3b">Kenya</text><rect x="250" y="292" width="52" height="28" rx="8" fill="#9c5b35"/><text x="314" y="312" font-size="13" fill="#294b3b" font-weight="700">850</text><rect x="70" y="348" width="1060" height="56" rx="14" fill="#294b3b"/><text x="600" y="382" font-size="13" fill="#f4eee4" text-anchor="middle">Prévision USDA 2026/27 : record éthiopien à 12,1 M de sacs ; Ouganda stable à 7,16 M (4e producteur mondial de robusta).</text></g><text x="600" y="442" font-family="Arial, sans-serif" font-size="12.5" fill="#63706a" text-anchor="middle">Source : bulletin Coffee: World Markets and Trade, USDA Foreign Agricultural Service, juillet 2026.</text></svg>
