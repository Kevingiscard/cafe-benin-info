<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520"><rect width="1400" height="520" fill="#0d0b09"/><g font-family="DM Sans,Arial,sans-serif" fill="#f6f0e7"><text x="60" y="70" font-size="38" font-weight="700">La chaîne du café, de la plante à la tasse</text><text x="60" y="105" font-size="18" fill="#a69e93">Chaque étape peut modifier la qualité, la stabilité et le profil sensoriel.</text></g><g font-family="DM Sans,Arial,sans-serif" text-anchor="middle"><g transform="translate(55 180)"><circle cx="90" cy="90" r="70" fill="#4b2514" stroke="#d58a4d"/><text x="90" y="85" fill="#fff" font-size="20" font-weight="700">Récolte</text><text x="90" y="112" fill="#c8bbae" font-size="14">cerises</text></g><g transform="translate(305 180)"><circle cx="90" cy="90" r="70" fill="#4b2514" stroke="#d58a4d"/><text x="90" y="85" fill="#fff" font-size="20" font-weight="700">Traitement</text><text x="90" y="112" fill="#c8bbae" font-size="14">lavé / naturel</text></g><g transform="translate(555 180)"><circle cx="90" cy="90" r="70" fill="#4b2514" stroke="#d58a4d"/><text x="90" y="85" fill="#fff" font-size="20" font-weight="700">Séchage</text><text x="90" y="112" fill="#c8bbae" font-size="14">stabilisation</text></g><g transform="translate(805 180)"><circle cx="90" cy="90" r="70" fill="#4b2514" stroke="#d58a4d"/><text x="90" y="85" fill="#fff" font-size="20" font-weight="700">Torréfaction</text><text x="90" y="112" fill="#c8bbae" font-size="14">développement</text></g><g transform="translate(1055 180)"><circle cx="90" cy="90" r="70" fill="#4b2514" stroke="#d58a4d"/><text x="90" y="85" fill="#fff" font-size="20" font-weight="700">Extraction</text><text x="90" y="112" fill="#c8bbae" font-size="14">tasse</text></g><g stroke="#d58a4d" stroke-width="3" fill="none"><path d="M215 270 H300"/><path d="M465 270 H550"/><path d="M715 270 H800"/><path d="M965 270 H1050"/></g></g><g fill="#a69e93" font-family="DM Sans,Arial,sans-serif" font-size="17"><text x="60" y="390">1. Cueillir au bon stade</text><text x="305" y="390">2. Libérer la graine</text><text x="555" y="390">3. Réduire l’humidité</text><text x="805" y="390">4. Former les arômes</text><text x="1055" y="390">5. Dissoudre les composés</text></g></svg>