<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">La voie lavée étape par étape</title><desc id="desc">Étapes décrites par le manuel FAO : dépulpage à l'eau, fermentation du mucilage un à deux jours, lavage à fond du parchemin, séchage jusqu'à 12 pour cent d'humidité. Consommation d'eau : 2 à 10 litres par kg de cerises fraîches.</desc><rect width="1200" height="430" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="245" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="192" cy="118" r="24" fill="#294b3b"/><text x="192" y="127" font-size="18" fill="#fffaf2" font-weight="700" text-anchor="middle">1</text><text x="192" y="176" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Dépulpage</text><text x="192" y="202" font-size="12.5" fill="#63706a" text-anchor="middle">à l'eau</text><rect x="340" y="70" width="245" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="462" cy="118" r="24" fill="#294b3b"/><text x="462" y="127" font-size="18" fill="#fffaf2" font-weight="700" text-anchor="middle">2</text><text x="462" y="176" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Fermentation</text><text x="462" y="202" font-size="12.5" fill="#63706a" text-anchor="middle">du mucilage, 1 à 2 jours</text><text x="462" y="222" font-size="12.5" fill="#63706a" text-anchor="middle">(gestion fine requise)</text><rect x="610" y="70" width="245" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="732" cy="118" r="24" fill="#294b3b"/><text x="732" y="127" font-size="18" fill="#fffaf2" font-weight="700" text-anchor="middle">3</text><text x="732" y="176" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Lavage</text><text x="732" y="202" font-size="12.5" fill="#63706a" text-anchor="middle">à fond du parchemin</text><rect x="880" y="70" width="245" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="1002" cy="118" r="24" fill="#294b3b"/><text x="1002" y="127" font-size="18" fill="#fffaf2" font-weight="700" text-anchor="middle">4</text><text x="1002" y="176" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Séchage</text><text x="1002" y="202" font-size="12.5" fill="#63706a" text-anchor="middle">jusqu'à 12 % d'humidité</text><rect x="70" y="330" width="1055" height="64" rx="14" fill="#294b3b"/><text x="597" y="369" font-size="14.5" fill="#fffaf2" text-anchor="middle">Eau nécessaire : 2 à 10 litres par kg de cerises fraîches (manuel FAO)</text></g></svg>
