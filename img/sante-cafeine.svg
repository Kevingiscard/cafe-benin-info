<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Repères EFSA 2015 pour la caféine</title><desc id="desc">Jusqu’à 400 mg par jour pour l’adulte en bonne santé, 200 mg par dose unique, 200 mg par jour pendant la grossesse et l’allaitement.</desc><rect width="1200" height="330" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><text x="70" y="64" font-size="17" fill="#294b3b" font-weight="700" text-anchor="start" >Repères de l’EFSA (2015) — caféine, sans problème de sécurité jusqu’à :</text><text x="70" y="130" font-size="15" fill="#294b3b" font-weight="700" text-anchor="start" >Adulte en bonne santé</text><rect x="330" y="100" width="640" height="40" rx="12" fill="#294b3b"/><text x="994" y="127" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="start" >400 mg / jour</text><text x="70" y="192" font-size="15" fill="#294b3b" font-weight="700" text-anchor="start" >Dose unique</text><rect x="330" y="162" width="320" height="40" rx="12" fill="#9c5b35"/><text x="674" y="189" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="start" >200 mg</text><text x="70" y="254" font-size="15" fill="#294b3b" font-weight="700" text-anchor="start" >Grossesse, allaitement</text><rect x="330" y="224" width="320" height="40" rx="12" fill="#496e5a"/><text x="674" y="251" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="start" >200 mg / jour</text><text x="70" y="300" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="start" >Apports toutes sources confondues ; repères officiels, pas conseils médicaux — en cas de doute, demander un avis professionnel.</text></g></svg>
