<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Le café devient une marchandise mondiale coloniale</title><desc id="desc">Le café arrive en Europe au XVIIe siècle et devient une marchandise mondiale lorsque les Européens le cultivent dans leurs colonies d'Amérique latine, d'Afrique et d'Asie. Aux Indes néerlandaises, à Java, il était prélevé sur les paysans comme impôt en nature. Le café a fait partie du système esclavagiste et du colonialisme.</desc><rect width="1200" height="430" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="330" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="235" y="125" font-size="14.5" fill="#294b3b" font-weight="700" text-anchor="middle">XVIIe siècle</text><text x="235" y="160" font-size="12.5" fill="#63706a" text-anchor="middle">le café arrive en Europe</text><text x="235" y="205" font-size="12.5" fill="#63706a" text-anchor="middle">puis devient une marchandise</text><text x="235" y="227" font-size="12.5" fill="#63706a" text-anchor="middle">mondiale par les colonies :</text><text x="235" y="255" font-size="12.5" fill="#9c5b35" text-anchor="middle">Amérique latine, Afrique, Asie</text><rect x="435" y="70" width="330" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="600" y="125" font-size="14.5" fill="#294b3b" font-weight="700" text-anchor="middle">Java, Indes néerlandaises</text><text x="600" y="180" font-size="12.5" fill="#63706a" text-anchor="middle">le café était prélevé</text><text x="600" y="202" font-size="12.5" fill="#63706a" text-anchor="middle">sur les paysans comme</text><text x="600" y="224" font-size="12.5" fill="#63706a" text-anchor="middle">impôt en nature</text><rect x="800" y="70" width="330" height="240" rx="18" fill="#294b3b"/><text x="965" y="125" font-size="14.5" fill="#fffaf2" font-weight="700" text-anchor="middle">Une histoire non adoucie</text><text x="965" y="180" font-size="12.5" fill="#f4eee4" text-anchor="middle">le café a fait partie du</text><text x="965" y="202" font-size="12.5" fill="#f4eee4" text-anchor="middle">système esclavagiste</text><text x="965" y="224" font-size="12.5" fill="#f4eee4" text-anchor="middle">et du colonialisme</text></g><text x="600" y="352" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Source : synthèse historique universitaire sur le café. Ce chapitre présente cette histoire sans l'adoucir.</text></svg>
