<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Qu'est-ce qu'un défaut du café vert</title><desc id="desc">Définition de la norme SCA : un défaut est une propriété du café vert ou torréfié généralement perçue comme négative. La FAO présente les principaux systèmes de classification des cafés verts.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="660" height="250" rx="20" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="110" y="126" font-size="19" fill="#294b3b" font-weight="700">Définition (norme SCA)</text><text x="110" y="172" font-size="15" fill="#63706a">Un défaut est une propriété du café</text><text x="110" y="198" font-size="15" fill="#63706a">vert ou torréfié généralement</text><text x="110" y="224" font-size="15" fill="#63706a">perçue comme négative.</text><text x="110" y="278" font-size="13" fill="#9c5b35" font-weight="700">Classification des cafés verts (SCA)</text><rect x="770" y="70" width="360" height="250" rx="20" fill="#294b3b"/><text x="950" y="126" font-size="17" fill="#fffaf2" font-weight="700" text-anchor="middle">Et dans le monde ?</text><text x="950" y="172" font-size="14" fill="#fffaf2" text-anchor="middle">La FAO présente les</text><text x="950" y="198" font-size="14" fill="#fffaf2" text-anchor="middle">principaux systèmes de</text><text x="950" y="224" font-size="14" fill="#fffaf2" text-anchor="middle">classification en vigueur.</text><text x="950" y="272" font-size="12.5" fill="#fffaf2" text-anchor="middle">Chaque origine peut avoir</text><text x="950" y="292" font-size="12.5" fill="#fffaf2" text-anchor="middle">sa propre grille de défauts.</text><text x="70" y="368" font-size="13" fill="#63706a">Compter et pondérer les défauts d'un échantillon sert à classer le café vert avant la vente.</text></g></svg>
