<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Bénin : des repères de production à recouper</title><desc id="desc">Repères documentés pour la production béninoise de café vert : un record de 3 000 tonnes en 1984 (chiffre d'une organisation extérieure à la FAO) ; environ 1 980 tonnes par an en moyenne dans les années 1980 selon l'OIC (33 000 sacs de 60 kg, calcul du site) ; environ 150 tonnes par an dans les années 1990 selon le décret de 2001 ; 55,13 tonnes en 2024 dans FAOSTAT, valeur estimée par la FAO et non déclarée par le pays.</desc><rect width="1200" height="430" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="250" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="195" y="120" font-size="13" fill="#63706a" text-anchor="middle">record</text><text x="195" y="168" font-size="30" fill="#294b3b" font-weight="700" text-anchor="middle">3 000 t</text><text x="195" y="200" font-size="13" fill="#294b3b" text-anchor="middle">en 1984</text><text x="195" y="238" font-size="11" fill="#9c5b35" text-anchor="middle">FAOSTAT, drapeau X :</text><text x="195" y="256" font-size="11" fill="#9c5b35" text-anchor="middle">chiffre d'une organisation</text><text x="195" y="274" font-size="11" fill="#9c5b35" text-anchor="middle">extérieure à la FAO</text><rect x="345" y="70" width="250" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="470" y="120" font-size="13" fill="#63706a" text-anchor="middle">années 1980</text><text x="470" y="168" font-size="30" fill="#294b3b" font-weight="700" text-anchor="middle">≈ 1 980 t</text><text x="470" y="200" font-size="13" fill="#294b3b" text-anchor="middle">par an en moyenne</text><text x="470" y="238" font-size="11" fill="#63706a" text-anchor="middle">OIC 2015 : 33 000 sacs</text><text x="470" y="256" font-size="11" fill="#63706a" text-anchor="middle">de 60 kg, conversion</text><text x="470" y="274" font-size="11" fill="#63706a" text-anchor="middle">calculée par le site</text><rect x="620" y="70" width="250" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="745" y="120" font-size="13" fill="#63706a" text-anchor="middle">années 1990</text><text x="745" y="168" font-size="30" fill="#294b3b" font-weight="700" text-anchor="middle">≈ 150 t</text><text x="745" y="200" font-size="13" fill="#294b3b" text-anchor="middle">par an, près de 600 ha</text><text x="745" y="238" font-size="11" fill="#63706a" text-anchor="middle">décret béninois</text><text x="745" y="256" font-size="11" fill="#63706a" text-anchor="middle">n° 2001-351</text><rect x="895" y="70" width="235" height="230" rx="18" fill="#294b3b"/><text x="1012" y="120" font-size="13" fill="#f4eee4" text-anchor="middle">2024</text><text x="1012" y="168" font-size="30" fill="#fffaf2" font-weight="700" text-anchor="middle">55,13 t</text><text x="1012" y="200" font-size="13" fill="#fffaf2" text-anchor="middle">sur 284 ha récoltés</text><text x="1012" y="238" font-size="11" fill="#f4eee4" text-anchor="middle">FAOSTAT, drapeau E :</text><text x="1012" y="256" font-size="11" fill="#f4eee4" text-anchor="middle">estimation FAO, non</text><text x="1012" y="274" font-size="11" fill="#f4eee4" text-anchor="middle">déclarée par le pays</text><rect x="70" y="322" width="1060" height="56" rx="14" fill="#fffaf2" stroke="#63706a" stroke-width="2" stroke-dasharray="6 5"/><text x="600" y="356" font-size="12.5" fill="#63706a" text-anchor="middle">Ces repères ne se recoupent pas encore : la série nationale reste à confirmer, aucun chiffre n'est présenté comme définitif.</text></g><text x="600" y="410" font-family="Arial, sans-serif" font-size="12.5" fill="#63706a" text-anchor="middle">Sources : FAOSTAT (fichier QCL du 31/12/2025), rapport OIC de 2015, décret béninois n° 2001-351.</text></svg>
