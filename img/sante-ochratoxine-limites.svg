<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Ochratoxine A : les teneurs maximales européennes</title><desc id="desc">Le règlement européen 2022/1370 fixe des teneurs maximales en ochratoxine A : 3,0 microgrammes par kilo pour le café torréfié et 5,0 microgrammes par kilo pour le café soluble. Il ne fixe pas de teneur maximale pour le café vert.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="320" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="230" y="160" font-size="40" fill="#294b3b" font-weight="700" text-anchor="middle">3,0</text><text x="230" y="195" font-size="13.5" fill="#294b3b" font-weight="700" text-anchor="middle">µg/kg maximum</text><text x="230" y="228" font-size="12.5" fill="#63706a" text-anchor="middle">café torréfié</text><rect x="440" y="80" width="320" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="600" y="160" font-size="40" fill="#294b3b" font-weight="700" text-anchor="middle">5,0</text><text x="600" y="195" font-size="13.5" fill="#294b3b" font-weight="700" text-anchor="middle">µg/kg maximum</text><text x="600" y="228" font-size="12.5" fill="#63706a" text-anchor="middle">café soluble</text><rect x="810" y="80" width="320" height="240" rx="18" fill="#fffaf2" stroke="#63706a" stroke-width="3" stroke-dasharray="6 5"/><text x="970" y="150" font-size="14" fill="#294b3b" font-weight="700" text-anchor="middle">Café vert</text><text x="970" y="195" font-size="12.5" fill="#63706a" text-anchor="middle">pas de teneur maximale</text><text x="970" y="217" font-size="12.5" fill="#63706a" text-anchor="middle">fixée par ce règlement</text></g><text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Source : règlement (UE) 2022/1370 sur les contaminants dans les denrées alimentaires.</text></svg>
