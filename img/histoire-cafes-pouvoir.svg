<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">1633 : la proscription des cafés d'Istanbul par Murat IV</title><desc id="desc">Les maisons de café inquiètent parfois les autorités : en septembre 1633, le sultan Murat IV proscrit les cafés et le tabac à Istanbul ; la recherche récente date l'épisode de 1633 alors qu'une synthèse universitaire longtemps reprise le plaçait en 1623.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="320" height="240" rx="18" fill="#294b3b"/><text x="230" y="165" font-size="46" fill="#fffaf2" font-weight="700" text-anchor="middle">1633</text><text x="230" y="202" font-size="13" fill="#f4eee4" text-anchor="middle">septembre, Istanbul</text><text x="230" y="224" font-size="13" fill="#f4eee4" text-anchor="middle">ottomane</text><rect x="440" y="80" width="360" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="620" y="140" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Murat IV</text><text x="620" y="178" font-size="13" fill="#63706a" text-anchor="middle">proscrit cafés et tabac,</text><text x="620" y="200" font-size="13" fill="#63706a" text-anchor="middle">une interdiction imposée</text><text x="620" y="222" font-size="13" fill="#63706a" text-anchor="middle">par la force</text><rect x="850" y="80" width="280" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="990" y="132" font-size="14" fill="#294b3b" font-weight="700" text-anchor="middle">Et 1623 ?</text><text x="990" y="172" font-size="11.5" fill="#63706a" text-anchor="middle">une synthèse universitaire</text><text x="990" y="192" font-size="11.5" fill="#63706a" text-anchor="middle">longtemps reprise datait</text><text x="990" y="212" font-size="11.5" fill="#63706a" text-anchor="middle">l épisode de 1623 ;</text><text x="990" y="232" font-size="11.5" fill="#9c5b35" text-anchor="middle">la recherche récente</text><text x="990" y="252" font-size="11.5" fill="#9c5b35" text-anchor="middle">le place en 1633</text></g><text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Sources : recherche de 2024 sur la proscription ottomane de 1633 ; synthèse universitaire qui la datait de 1623.</text></svg>
