<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Sous Murat IV : les cafés d'Istanbul détruits sur ordre du sultan</title><desc id="desc">Les maisons de café inquiètent parfois les autorités : sous le règne du sultan Murat IV (1623-1640), les cafés d'Istanbul sont détruits sur son ordre.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="320" height="240" rx="18" fill="#294b3b"/><text x="230" y="160" font-size="34" fill="#fffaf2" font-weight="700" text-anchor="middle">1623-1640</text><text x="230" y="196" font-size="13" fill="#f4eee4" text-anchor="middle">règne de Murat IV,</text><text x="230" y="218" font-size="13" fill="#f4eee4" text-anchor="middle">Istanbul ottomane</text><rect x="440" y="80" width="360" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="620" y="140" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Murat IV</text><text x="620" y="185" font-size="13" fill="#63706a" text-anchor="middle">sur son ordre, les cafés de la ville</text><text x="620" y="207" font-size="13" fill="#63706a" text-anchor="middle">sont détruits</text><rect x="850" y="80" width="280" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="990" y="140" font-size="14" fill="#294b3b" font-weight="700" text-anchor="middle">Pourquoi ?</text><text x="990" y="185" font-size="12.5" fill="#63706a" text-anchor="middle">les maisons de café</text><text x="990" y="207" font-size="12.5" fill="#63706a" text-anchor="middle">inquiètent parfois</text><text x="990" y="229" font-size="12.5" fill="#63706a" text-anchor="middle">les autorités</text></g><text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Source : synthèse historique universitaire sur le café.</text></svg>
