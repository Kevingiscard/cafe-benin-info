<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Le genre Coffea : 124 espèces, 60 pour cent menacées</title><desc id="desc">Le genre Coffea comprend au moins 124 espèces réparties en Afrique, à Madagascar et dans la zone Asie-Pacifique. Selon l'évaluation de la Liste rouge de l'UICN menée par Kew, 60 pour cent sont menacées d'extinction. Les espèces sauvages servent à améliorer les variétés cultivées.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="320" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="230" y="160" font-size="52" fill="#294b3b" font-weight="700" text-anchor="middle">124</text><text x="230" y="200" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">espèces de Coffea</text><text x="230" y="228" font-size="12.5" fill="#63706a" text-anchor="middle">au moins, dans le monde</text><rect x="440" y="70" width="320" height="230" rx="18" fill="#294b3b"/><text x="600" y="160" font-size="52" fill="#fffaf2" font-weight="700" text-anchor="middle">60 %</text><text x="600" y="200" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">menacées d'extinction</text><text x="600" y="228" font-size="12.5" fill="#f4eee4" text-anchor="middle">Liste rouge UICN, évaluation Kew</text><rect x="810" y="70" width="320" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="970" y="130" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Répartition</text><text x="970" y="170" font-size="13" fill="#63706a" text-anchor="middle">Afrique</text><text x="970" y="196" font-size="13" fill="#63706a" text-anchor="middle">Madagascar</text><text x="970" y="222" font-size="13" fill="#63706a" text-anchor="middle">Asie-Pacifique</text><text x="970" y="262" font-size="12.5" fill="#9c5b35" text-anchor="middle">les espèces sauvages comptent</text><text x="970" y="282" font-size="12.5" fill="#9c5b35" text-anchor="middle">pour améliorer les cultivars</text></g><text x="600" y="352" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Sources : catalogue des espèces de café, évaluation Kew pour la Liste rouge UICN, étude sur l'intérêt des espèces sauvages.</text></svg>
