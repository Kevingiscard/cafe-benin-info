<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Frise des repères documentés de l’histoire du café</title><desc id="desc">Quatre étapes : soufis du Yémen au XVe siècle, commerce Éthiopie–Yémen au milieu du XVe siècle, arrivée en Europe au XVIIe siècle, monopole de Moka jusqu’à la fin du XVIIe siècle.</desc><rect width="1200" height="360" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><line x1="80" y1="180" x2="1120" y2="180" stroke="#294b3b" stroke-width="4"/><circle cx="150" cy="180" r="13" fill="#9c5b35"/><text x="150" y="76" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle" >XVe s.</text><text x="150" y="104" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >Des soufis du Yémen</text><text x="150" y="124" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >boivent la qahwa</text><line x1="150" y1="140" x2="150" y2="167" stroke="#9c5b35" stroke-width="3"/><circle cx="450" cy="180" r="13" fill="#9c5b35"/><text x="450" y="246" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle" >mil. XVe s.</text><text x="450" y="274" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >Petit commerce</text><text x="450" y="294" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >Éthiopie–Yémen</text><line x1="450" y1="193" x2="450" y2="222" stroke="#9c5b35" stroke-width="3"/><circle cx="750" cy="180" r="13" fill="#9c5b35"/><text x="750" y="76" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle" >XVIIe s.</text><text x="750" y="104" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >Le café gagne</text><text x="750" y="124" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >l’Europe</text><line x1="750" y1="140" x2="750" y2="167" stroke="#9c5b35" stroke-width="3"/><circle cx="1050" cy="180" r="13" fill="#9c5b35"/><text x="1050" y="246" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle" >fin XVIIe s.</text><text x="1050" y="274" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >Production concentrée</text><text x="1050" y="294" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >au Yémen (Moka)</text><line x1="1050" y1="193" x2="1050" y2="222" stroke="#9c5b35" stroke-width="3"/><text x="600" y="340" font-size="13" fill="#63706a" font-weight="400" text-anchor="middle" >Repères documentés, sans les légendes d’origine — sources : British Museum, UC Santa Cruz, Folger, BBC.</text></g></svg>
