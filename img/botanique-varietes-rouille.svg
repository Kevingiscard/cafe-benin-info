<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Étude World Coffee Research 2025 sur la rouille</title><desc id="desc">Une étude coordonnée par World Coffee Research a comparé en 2025 la réponse de 29 variétés d'Arabica à la rouille dans 15 pays sur 23 sites. Les variétés répondent différemment selon les conditions : le choix d'une variété s'apprécie localement.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="245" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="192" y="160" font-size="46" fill="#294b3b" font-weight="700" text-anchor="middle">29</text><text x="192" y="200" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">variétés d'Arabica</text><text x="192" y="226" font-size="12.5" fill="#63706a" text-anchor="middle">comparées</text><rect x="340" y="70" width="245" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="462" y="160" font-size="46" fill="#294b3b" font-weight="700" text-anchor="middle">15</text><text x="462" y="200" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">pays</text><text x="462" y="226" font-size="12.5" fill="#63706a" text-anchor="middle">couverts par l'essai</text><rect x="610" y="70" width="245" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="732" y="160" font-size="46" fill="#294b3b" font-weight="700" text-anchor="middle">23</text><text x="732" y="200" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">sites d'essai</text><text x="732" y="226" font-size="12.5" fill="#63706a" text-anchor="middle">conditions variées</text><rect x="880" y="70" width="250" height="230" rx="18" fill="#294b3b"/><text x="1005" y="130" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">Enseignement</text><text x="1005" y="168" font-size="12.5" fill="#f4eee4" text-anchor="middle">la réponse à la rouille</text><text x="1005" y="188" font-size="12.5" fill="#f4eee4" text-anchor="middle">dépend des conditions :</text><text x="1005" y="212" font-size="12.5" fill="#f4eee4" text-anchor="middle">le choix d'une variété</text><text x="1005" y="232" font-size="12.5" fill="#f4eee4" text-anchor="middle">s'apprécie localement</text></g><text x="600" y="352" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Étude coordonnée par World Coffee Research, publiée en 2025.</text></svg>
