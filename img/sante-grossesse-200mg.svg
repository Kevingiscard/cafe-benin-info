<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Grossesse et allaitement : le repère EFSA de 200 mg</title><desc id="desc">Pour les femmes enceintes ou allaitantes, l'EFSA indique que des apports en caféine jusqu'à 200 milligrammes par jour, répartis dans la journée, ne soulèvent pas de problème de sécurité pour le fœtus ; il s'agit d'un repère général de sécurité, pas d'une dose conseillée individuellement.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="420" height="240" rx="18" fill="#294b3b"/><text x="280" y="175" font-size="52" fill="#fffaf2" font-weight="700" text-anchor="middle">200 mg</text><text x="280" y="215" font-size="14" fill="#fffaf2" font-weight="700" text-anchor="middle">de caféine par jour</text><text x="280" y="245" font-size="12.5" fill="#f4eee4" text-anchor="middle">répartis dans la journée</text><rect x="540" y="80" width="590" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="835" y="140" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Pour qui ?</text><text x="835" y="175" font-size="13" fill="#63706a" text-anchor="middle">les femmes enceintes ou allaitantes</text><text x="835" y="222" font-size="12.5" fill="#63706a" text-anchor="middle">jusqu'à ce niveau, pas de problème de sécurité</text><text x="835" y="244" font-size="12.5" fill="#63706a" text-anchor="middle">relevé pour le fœtus : un repère général,</text><text x="835" y="266" font-size="12.5" fill="#63706a" text-anchor="middle">pas une dose conseillée individuellement</text></g><text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Source : avis scientifique de l'EFSA sur la sécurité de la caféine.</text></svg>
