<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Origine hybride du caféier Arabica</title><desc id="desc">Coffea arabica est un hybride allotétraploïde de Coffea canephora et Coffea eugenioides, avec 44 chromosomes.</desc><rect width="1200" height="360" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><circle cx="300" cy="120" r="72" fill="#fffaf2" stroke="#9c5b35" stroke-width="4"/><text x="300" y="112" font-size="18" fill="#294b3b" font-weight="700" text-anchor="middle" >C. canephora</text><text x="300" y="138" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >(robusta)</text><circle cx="300" cy="270" r="72" fill="#fffaf2" stroke="#9c5b35" stroke-width="4"/><text x="300" y="262" font-size="18" fill="#294b3b" font-weight="700" text-anchor="middle" >C. eugenioides</text><text x="300" y="288" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >espèce parente</text><path d="M380 120 C 500 120 500 195 610 195 M380 270 C 500 270 500 195 610 195" stroke="#294b3b" stroke-width="4" fill="none"/><path d="M610 195 l-16 -9 m16 9 -16 9" stroke="#294b3b" stroke-width="4" fill="none"/><circle cx="790" cy="195" r="104" fill="#fffaf2" stroke="#294b3b" stroke-width="5"/><text x="790" y="168" font-size="22" fill="#294b3b" font-weight="700" text-anchor="middle" >C. arabica</text><text x="790" y="196" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >hybride allotétraploïde</text><text x="790" y="220" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="middle" >2n = 44 chromosomes</text><rect x="960" y="120" width="200" height="150" rx="18" fill="#496e5a"/><g fill="#fffaf2"><text x="1060" y="162" font-size="26" fill="#fffaf2" font-weight="700" text-anchor="middle" >≈ 60 %</text><text x="1060" y="190" font-size="13" fill="#fffaf2" font-weight="400" text-anchor="middle" >des produits à base</text><text x="1060" y="208" font-size="13" fill="#fffaf2" font-weight="400" text-anchor="middle" >de café dans le monde</text><text x="1060" y="232" font-size="12" fill="#fffaf2" font-weight="400" text-anchor="middle" >(Nature, 2024)</text></g><text x="600" y="330" font-size="13" fill="#63706a" font-weight="400" text-anchor="middle" >Schéma de principe : hybridation entre deux espèces parentes — Lashermes et al. 1999 ; Nature 2024.</text></g></svg>
