<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#0d0b09"/><g font-family="DM Sans,Arial,sans-serif"><text x="70" y="70" fill="#f6f0e7" font-size="40" font-weight="700">Lire une courbe de torréfaction</text><text x="70" y="105" fill="#a69e93" font-size="18">La chaleur transforme progressivement le grain vert et développe ses arômes.</text><line x1="120" y1="530" x2="1010" y2="530" stroke="#5b5148"/><line x1="120" y1="160" x2="120" y2="530" stroke="#5b5148"/><path d="M125 500 C250 490 330 460 430 400 C530 340 560 260 650 225 C750 185 790 160 870 150 C925 143 960 132 1000 118" fill="none" stroke="#d58a4d" stroke-width="6"/><g fill="#c8bbae" font-size="17"><text x="75" y="545">temps</text><text x="75" y="175">température</text><text x="210" y="485">Séchage</text><text x="450" y="365">Jaunissement</text><text x="600" y="205">1er crack</text><text x="840" y="135">Développement</text></g><g fill="#f6f0e7" font-size="20" font-weight="700"><text x="190" y="585">Évolution thermique : ce schéma est pédagogique, pas un profil universel.</text></g></svg>