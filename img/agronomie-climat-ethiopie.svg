<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Climat : le cas de l'Éthiopie modélisé en 2017</title><desc id="desc">Une étude de 2017 dans Nature Plants modélise l'Éthiopie : les zones actuelles de culture du café pourraient diminuer jusqu'à 60 pour cent pour une hausse de 4 degrés d'ici la fin du siècle, dans le scénario d'émissions élevées du GIEC. Avec des scénarios plus modérés, la perte est plus faible. Le résultat vaut pour l'Éthiopie et ces hypothèses.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="480" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="310" y="135" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Étude Nature Plants, 2017</text><text x="310" y="165" font-size="12.5" fill="#63706a" text-anchor="middle">Kew et partenaires éthiopiens</text><text x="310" y="215" font-size="13" fill="#63706a" text-anchor="middle">modélisation des zones de culture</text><text x="310" y="237" font-size="13" fill="#63706a" text-anchor="middle">du café en Éthiopie</text><rect x="590" y="80" width="330" height="240" rx="18" fill="#294b3b"/><text x="755" y="160" font-size="46" fill="#fffaf2" font-weight="700" text-anchor="middle">- 60 %</text><text x="755" y="200" font-size="13" fill="#f4eee4" text-anchor="middle">de zones en moins, au pire :</text><text x="755" y="224" font-size="12.5" fill="#f4eee4" text-anchor="middle">+4 °C, émissions élevées GIEC,</text><text x="755" y="244" font-size="12.5" fill="#f4eee4" text-anchor="middle">fin du siècle</text><rect x="950" y="80" width="180" height="240" rx="18" fill="#fffaf2" stroke="#63706a" stroke-width="3" stroke-dasharray="6 5"/><text x="1040" y="140" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Portée</text><text x="1040" y="180" font-size="11.5" fill="#63706a" text-anchor="middle">valable pour</text><text x="1040" y="200" font-size="11.5" fill="#63706a" text-anchor="middle">l'Éthiopie et ces</text><text x="1040" y="220" font-size="11.5" fill="#63706a" text-anchor="middle">hypothèses, pas</text><text x="1040" y="240" font-size="11.5" fill="#63706a" text-anchor="middle">pour le café</text><text x="1040" y="260" font-size="11.5" fill="#63706a" text-anchor="middle">en général</text></g><text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Scénarios modérés : perte plus faible. Sources : étude Nature Plants et sa synthèse grand public.</text></svg>
