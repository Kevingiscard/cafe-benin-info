<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Ce que la norme Golden Cup couvre, et ce qu'elle ne couvre pas</title><desc id="desc">Les plages de force 1,15 à 1,35 pour cent et de rendement 18 à 22 pour cent viennent d'un article de 1957 et décrivent le café filtre. Elles ne couvrent pas l'espresso.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="510" height="250" rx="20" fill="#fffaf2" stroke="#294b3b" stroke-width="3"/><text x="325" y="124" font-size="18" fill="#294b3b" font-weight="700" text-anchor="middle">Couvert par la norme</text><text x="325" y="172" font-size="14.5" fill="#63706a" text-anchor="middle">café filtre (méthodes douces)</text><text x="325" y="208" font-size="14.5" fill="#63706a" text-anchor="middle">force 1,15–1,35 % · rendement 18–22 %</text><text x="325" y="244" font-size="14.5" fill="#63706a" text-anchor="middle">panels entraînés et consommateurs</text><rect x="620" y="70" width="510" height="250" rx="20" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="875" y="124" font-size="18" fill="#9c5b35" font-weight="700" text-anchor="middle">Hors de la norme</text><text x="875" y="172" font-size="14.5" fill="#63706a" text-anchor="middle">espresso : force et rendement différents</text><text x="875" y="208" font-size="14.5" fill="#63706a" text-anchor="middle">plages issues d'un article de 1957</text><text x="875" y="244" font-size="14.5" fill="#63706a" text-anchor="middle">à lire comme des repères, pas une loi</text><text x="600" y="368" font-size="13" fill="#63706a" text-anchor="middle">Les plages sont réelles mais datées et limitées au filtre ; l'espresso suit d'autres repères.</text></g></svg>
