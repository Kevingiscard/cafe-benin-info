<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc"><title id="title">Étapes du protocole de cupping</title><desc id="desc">8,25 g de café pour 150 ml d’eau à environ 93 degrés, croûte brisée après 4 minutes, puis dégustation.</desc><rect width="1200" height="270" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><circle cx="149.0" cy="112" r="56" fill="#fffaf2" stroke="#9c5b35" stroke-width="4"/><text x="149.0" y="104" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">8,25 g de café</text><path d="M249 112 h26 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><circle cx="375.0" cy="112" r="56" fill="#fffaf2" stroke="#9c5b35" stroke-width="4"/><text x="375.0" y="94" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">150 ml d’eau</text><text x="375.0" y="114" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">(≈1:18)</text><path d="M475 112 h26 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><circle cx="601.0" cy="112" r="56" fill="#fffaf2" stroke="#9c5b35" stroke-width="4"/><text x="601.0" y="104" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">eau ≈ 93 °C</text><path d="M701 112 h26 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><circle cx="827.0" cy="112" r="56" fill="#fffaf2" stroke="#9c5b35" stroke-width="4"/><text x="827.0" y="94" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">croûte brisée</text><text x="827.0" y="114" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">à 4 min</text><path d="M927 112 h26 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><circle cx="1053.0" cy="112" r="56" fill="#fffaf2" stroke="#9c5b35" stroke-width="4"/><text x="1053.0" y="104" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">dégustation</text><text x="600" y="236" font-size="13" fill="#63706a" font-weight="400" text-anchor="middle">Protocole de cupping couramment décrit pour la norme SCA — description par des sources secondaires (Royal Coffee, Gota).</text></g></svg>
