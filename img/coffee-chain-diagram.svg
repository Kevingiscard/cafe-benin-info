<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Chaîne du café, de la plante à la tasse</title><desc id="desc">Cinq étapes reliées : plante, récolte, transformation, torréfaction et extraction.</desc><rect width="1200" height="300" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#294b3b" font-size="18" font-weight="700"><text x="120" y="218">Plante</text><text x="360" y="218">Récolte</text><text x="600" y="218">Transformation</text><text x="840" y="218">Torréfaction</text><text x="1080" y="218">Tasse</text></g><g fill="#9c5b35" font-size="14"><text x="120" y="244">espèce · sol · eau</text><text x="360" y="244">maturité · tri</text><text x="600" y="244">séchage · fermentation</text><text x="840" y="244">chaleur · développement</text><text x="1080" y="244">eau · mouture · temps</text></g><g fill="#fffaf2" stroke="#9c5b35" stroke-width="4"><circle cx="120" cy="112" r="58"/><circle cx="360" cy="112" r="58"/><circle cx="600" cy="112" r="58"/><circle cx="840" cy="112" r="58"/><circle cx="1080" cy="112" r="58"/></g><g fill="#9c5b35" font-size="42"><text x="120" y="128">✿</text><text x="360" y="128">◉</text><text x="600" y="128">≈</text><text x="840" y="128">☼</text><text x="1080" y="128">◒</text></g><g stroke="#294b3b" stroke-width="3" fill="none"><path d="M180 112h120l-14-10m14 10-14 10M420 112h120l-14-10m14 10-14 10M660 112h120l-14-10m14 10-14 10M900 112h120l-14-10m14 10-14 10"/></g></g></svg>
