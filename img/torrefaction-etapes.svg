<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Étapes repères de la torréfaction</title><desc id="desc">Premier crack vers 205 degrés avec doublement de volume et 5 pour cent de perte de masse, brun moyen vers 220 degrés avec 13 pour cent de perte, puis phase endothermique avant le second crack.</desc><rect width="1200" height="360" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="58" y="80" width="196" height="120" rx="18" fill="#fffaf2" stroke="#294b3b" stroke-width="3"/><text x="156.0" y="130" font-size="16.5" fill="#294b3b" font-weight="700" text-anchor="middle">Grain vert</text><text x="156.0" y="158" font-size="12" fill="#63706a" font-weight="400" text-anchor="middle">départ</text><path d="M259 140 h20 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="284" y="80" width="196" height="120" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="382.0" y="130" font-size="16.5" fill="#294b3b" font-weight="700" text-anchor="middle">~205 °C</text><text x="382.0" y="158" font-size="12" fill="#63706a" font-weight="400" text-anchor="middle">premier crack ·</text><text x="382.0" y="175" font-size="12" fill="#63706a" font-weight="400" text-anchor="middle">volume ×2 · −5 %</text><path d="M485 140 h20 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="510" y="80" width="196" height="120" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="608.0" y="130" font-size="16.5" fill="#294b3b" font-weight="700" text-anchor="middle">205–220 °C</text><text x="608.0" y="158" font-size="12" fill="#63706a" font-weight="400" text-anchor="middle">brun moyen · −13 %</text><path d="M711 140 h20 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="736" y="80" width="196" height="120" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="834.0" y="130" font-size="16.5" fill="#294b3b" font-weight="700" text-anchor="middle">courte phase</text><text x="834.0" y="158" font-size="12" fill="#63706a" font-weight="400" text-anchor="middle">endothermique</text><path d="M937 140 h20 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="962" y="80" width="196" height="120" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="1060.0" y="130" font-size="16.5" fill="#294b3b" font-weight="700" text-anchor="middle">second crack</text><text x="1060.0" y="158" font-size="12" fill="#63706a" font-weight="400" text-anchor="middle">limite conseillée*</text><rect x="58" y="240" width="1106" height="22" rx="11" fill="#496e5a" opacity="0.25"/><rect x="58" y="240" width="1106" height="22" rx="11" fill="none" stroke="#9c5b35" stroke-width="2"/><text x="72" y="286" font-size="13" fill="#496e5a" font-weight="700" text-anchor="start">vert</text><text x="1150" y="286" font-size="13" fill="#9c5b35" font-weight="700" text-anchor="end">brun foncé</text><text x="600" y="330" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle">Repères indicatifs du Coffee Research Institute ; les températures varient avec la machine, la charge et le capteur. *avis de ses auteurs.</text></g></svg>
