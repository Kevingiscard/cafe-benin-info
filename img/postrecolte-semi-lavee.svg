<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Voie semi-lavée : le mucilage retiré sans fermentation</title><desc id="desc">Après dépulpage, un démucilageur retire mécaniquement le mucilage, sans fermentation. Le manuel FAO indique environ 0,5 litre d'eau par kg de cerises fraîches, mesuré lors d'études au Laos et au Myanmar.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="70" width="330" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="235" cy="118" r="24" fill="#294b3b"/><text x="235" y="127" font-size="18" fill="#fffaf2" font-weight="700" text-anchor="middle">1</text><text x="235" y="176" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Dépulpage</text><text x="235" y="202" font-size="12.5" fill="#63706a" text-anchor="middle">comme la voie lavée</text><rect x="430" y="70" width="330" height="230" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="595" cy="118" r="24" fill="#294b3b"/><text x="595" y="127" font-size="18" fill="#fffaf2" font-weight="700" text-anchor="middle">2</text><text x="595" y="176" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Démucilageur</text><text x="595" y="202" font-size="12.5" fill="#63706a" text-anchor="middle">mucilage retiré mécaniquement</text><text x="595" y="222" font-size="12.5" fill="#63706a" text-anchor="middle">sans fermentation</text><rect x="790" y="70" width="340" height="230" rx="18" fill="#294b3b"/><text x="960" y="118" font-size="26" fill="#fffaf2" font-weight="700" text-anchor="middle">≈ 0,5 L / kg</text><text x="960" y="156" font-size="13" fill="#fffaf2" text-anchor="middle">d'eau par kg de cerises fraîches</text><text x="960" y="186" font-size="12.5" fill="#fffaf2" text-anchor="middle">mesuré lors d'études</text><text x="960" y="206" font-size="12.5" fill="#fffaf2" text-anchor="middle">au Laos et au Myanmar</text><text x="960" y="248" font-size="12.5" fill="#fffaf2" text-anchor="middle">(manuel FAO)</text><text x="70" y="356" font-size="13" fill="#63706a">À comparer avec la voie lavée : 2 à 10 litres par kg — la semi-lavée économise l'eau en supprimant la fermentation.</text></g></svg>
