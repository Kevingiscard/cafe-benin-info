<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">La zone Golden Cup</title><desc id="desc">Graphique : force (TDS) de 1,15 à 1,35 pour cent en vertical, rendement d'extraction de 18 à 22 pour cent en horizontal. La zone où les deux plages se croisent est le point d'équilibre jugé par les panels.</desc><rect width="1200" height="460" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><text x="70" y="66" font-size="22" fill="#294b3b" font-weight="700">Le point de rencontre jugé équilibré</text><text x="70" y="94" font-size="14" fill="#63706a">Force (TDS) × rendement d'extraction — plages de la norme Golden Cup</text><rect x="140" y="130" width="880" height="240" rx="16" fill="#fffaf2" stroke="#d9d4cf" stroke-width="2"/><rect x="420" y="150" width="320" height="200" rx="12" fill="#dde6df" stroke="#294b3b" stroke-width="3"/><text x="580" y="244" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle">Zone Golden Cup</text><text x="580" y="270" font-size="13" fill="#294b3b" text-anchor="middle">café jugé équilibré</text><text x="580" y="292" font-size="13" fill="#294b3b" text-anchor="middle">par des panels entraînés</text><line x1="140" y1="150" x2="1020" y2="150" stroke="#9c5b35" stroke-width="2" stroke-dasharray="6 6"/><text x="1050" y="155" font-size="13" fill="#9c5b35" font-weight="700">1,35 %</text><line x1="140" y1="350" x2="1020" y2="350" stroke="#9c5b35" stroke-width="2" stroke-dasharray="6 6"/><text x="1050" y="355" font-size="13" fill="#9c5b35" font-weight="700">1,15 %</text><text x="1050" y="250" font-size="12.5" fill="#63706a">force</text><text x="1050" y="266" font-size="12.5" fill="#63706a">(TDS)</text><line x1="420" y1="130" x2="420" y2="370" stroke="#9c5b35" stroke-width="2" stroke-dasharray="6 6"/><text x="420" y="398" font-size="13" fill="#9c5b35" font-weight="700" text-anchor="middle">18 %</text><line x1="740" y1="130" x2="740" y2="370" stroke="#9c5b35" stroke-width="2" stroke-dasharray="6 6"/><text x="740" y="398" font-size="13" fill="#9c5b35" font-weight="700" text-anchor="middle">22 %</text><text x="580" y="428" font-size="13" fill="#63706a" text-anchor="middle">rendement d'extraction — part de la mouture dissoute dans la tasse</text></g></svg>
