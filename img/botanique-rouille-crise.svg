<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Rouille et scolyte : deux ennemis du caféier</title><desc id="desc">La crise de la rouille en Amérique centrale, à partir de 2011-2012, a révélé un manque d'informations sur les bonnes pratiques de lutte. Une revue systématique examine la gestion de la rouille et du scolyte du fruit en systèmes agroforestiers.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="330" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="235" y="135" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">La rouille</text><text x="235" y="168" font-size="12.5" fill="#63706a" text-anchor="middle">crise en Amérique centrale</text><text x="235" y="190" font-size="12.5" fill="#63706a" text-anchor="middle">à partir de 2011-2012</text><text x="235" y="232" font-size="12.5" fill="#9c5b35" text-anchor="middle">a révélé un manque</text><text x="235" y="252" font-size="12.5" fill="#9c5b35" text-anchor="middle">d'informations sur les</text><text x="235" y="272" font-size="12.5" fill="#9c5b35" text-anchor="middle">bonnes pratiques de lutte</text><rect x="435" y="80" width="330" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="600" y="135" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Le scolyte du fruit</text><text x="600" y="168" font-size="12.5" fill="#63706a" text-anchor="middle">insecte foreur des cerises</text><text x="600" y="232" font-size="12.5" fill="#63706a" text-anchor="middle">gestion étudiée avec celle</text><text x="600" y="252" font-size="12.5" fill="#63706a" text-anchor="middle">de la rouille en milieu</text><text x="600" y="272" font-size="12.5" fill="#63706a" text-anchor="middle">agroforestier</text><rect x="800" y="80" width="330" height="240" rx="18" fill="#294b3b"/><text x="965" y="135" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">Piste de gestion</text><text x="965" y="180" font-size="12.5" fill="#f4eee4" text-anchor="middle">une revue systématique</text><text x="965" y="202" font-size="12.5" fill="#f4eee4" text-anchor="middle">examine la lutte contre</text><text x="965" y="224" font-size="12.5" fill="#f4eee4" text-anchor="middle">ces deux bioagresseurs en</text><text x="965" y="246" font-size="12.5" fill="#f4eee4" text-anchor="middle">systèmes agroforestiers</text></g><text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Sources : bilan de la crise de la rouille par World Coffee Research ; revue systématique sur la gestion en agroforesterie.</text></svg>
