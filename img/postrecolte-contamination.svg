<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Un lot se gâte par contact</title><desc id="desc">Selon le manuel FAO, toute partie fermentée de la veille contamine les cerises fraîchement récoltées et dégrade tout le lot. Une sélection rigoureuse des cerises rouges mûres facilite le dépulpage et le classement.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="300" height="220" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="220" y="130" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Restes fermentés</text><text x="220" y="156" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">de la veille</text><text x="220" y="204" font-size="12.5" fill="#63706a" text-anchor="middle">une seule partie</text><text x="220" y="224" font-size="12.5" fill="#63706a" text-anchor="middle">fermentée suffit</text><path d="M400 190 L480 190" stroke="#9c5b35" stroke-width="4"/><path d="M480 190 L462 178 M480 190 L462 202" stroke="#9c5b35" stroke-width="4" fill="none"/><rect x="510" y="80" width="300" height="220" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3" stroke-dasharray="8 6"/><text x="660" y="130" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="middle">Contamination</text><text x="660" y="204" font-size="12.5" fill="#63706a" text-anchor="middle">des cerises fraîchement</text><text x="660" y="224" font-size="12.5" fill="#63706a" text-anchor="middle">récoltées</text><path d="M840 190 L920 190" stroke="#9c5b35" stroke-width="4"/><path d="M920 190 L902 178 M920 190 L902 202" stroke="#9c5b35" stroke-width="4" fill="none"/><rect x="950" y="80" width="180" height="220" rx="18" fill="#294b3b"/><text x="1040" y="140" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">Tout le lot</text><text x="1040" y="166" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">dégradé</text><text x="1040" y="220" font-size="12.5" fill="#fffaf2" text-anchor="middle">(manuel FAO)</text><text x="70" y="360" font-size="13" fill="#63706a">Parade : une sélection rigoureuse des cerises rouges mûres, qui facilite aussi le dépulpage et le classement.</text></g></svg>
