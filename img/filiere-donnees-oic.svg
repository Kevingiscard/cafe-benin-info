<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Les flux suivis par l'OIC : exportations, importations, réexportations</title><desc id="desc">L'Organisation internationale du café suit les flux du commerce mondial : les exportations partent des pays producteurs, les importations arrivent dans les pays consommateurs, et une partie du café importé est réexportée.</desc><rect width="1200" height="430" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="120" width="300" height="160" rx="18" fill="#294b3b"/><text x="220" y="190" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">Pays producteurs</text><text x="220" y="222" font-size="12.5" fill="#f4eee4" text-anchor="middle">café vert expédié</text><rect x="810" y="90" width="320" height="220" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="970" y="150" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Pays consommateurs</text><text x="970" y="182" font-size="12.5" fill="#63706a" text-anchor="middle">importations : café reçu</text><text x="970" y="236" font-size="12.5" fill="#63706a" text-anchor="middle">réexportations :</text><text x="970" y="258" font-size="12.5" fill="#63706a" text-anchor="middle">une partie repart après import</text><path d="M 380 170 L 800 140" stroke="#9c5b35" stroke-width="4" fill="none"/><path d="M 800 140 l -18 -4 l 4 12 z" fill="#9c5b35"/><text x="590" y="130" font-size="13" fill="#9c5b35" font-weight="700" text-anchor="middle">exportations</text><path d="M 900 312 C 830 332 720 338 645 332" stroke="#63706a" stroke-width="4" fill="none" stroke-dasharray="8 6"/><path d="M 645 332 l 16 8 l -1 -13 z" fill="#63706a"/><text x="772" y="368" font-size="13" fill="#63706a" font-weight="700" text-anchor="middle">réexportations : une partie repart vers d’autres destinations</text></g><text x="600" y="356" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">L'OIC publie les volumes et tendances de ces trois flux pour le commerce mondial du café.</text></svg>
