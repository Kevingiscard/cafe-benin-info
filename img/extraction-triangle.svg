<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="#0d0b09"/><g font-family="DM Sans,Arial,sans-serif" text-anchor="middle"><text x="500" y="70" fill="#f6f0e7" font-size="40" font-weight="700">Le triangle de l’extraction</text><text x="500" y="108" fill="#a69e93" font-size="18">Pour comprendre pourquoi une tasse change quand on modifie un seul paramètre.</text><polygon points="500,170 210,570 790,570" fill="#171512" stroke="#d58a4d" stroke-width="4"/><circle cx="500" cy="170" r="88" fill="#3d2012"/><circle cx="210" cy="570" r="88" fill="#3d2012"/><circle cx="790" cy="570" r="88" fill="#3d2012"/><text x="500" y="160" fill="#fff" font-size="25" font-weight="700">Eau</text><text x="500" y="190" fill="#c8bbae" font-size="16">température · qualité</text><text x="210" y="560" fill="#fff" font-size="25" font-weight="700">Mouture</text><text x="210" y="590" fill="#c8bbae" font-size="16">finesse · distribution</text><text x="790" y="560" fill="#fff" font-size="25" font-weight="700">Temps</text><text x="790" y="590" fill="#c8bbae" font-size="16">contact · débit</text><text x="500" y="375" fill="#f6f0e7" font-size="27" font-weight="700">EXTRACTION</text><text x="500" y="412" fill="#a69e93" font-size="17">ratio + agitation + méthode</text><text x="500" y="655" fill="#d58a4d" font-size="17">Principe pédagogique : modifier un paramètre à la fois pour comprendre son effet.</text></g></svg>