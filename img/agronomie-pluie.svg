<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Pluie : 1 500 à 3 000 mm par an</title><desc id="desc">Le café demande en général 1 500 à 3 000 millimètres de pluie par an. Le besoin réel dépend de la rétention du sol, de l'humidité de l'air, de la nébulosité et des pratiques culturales.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="80" width="400" height="240" rx="18" fill="#294b3b"/><text x="270" y="165" font-size="40" fill="#fffaf2" font-weight="700" text-anchor="middle">1 500 à 3 000</text><text x="270" y="205" font-size="15" fill="#fffaf2" font-weight="700" text-anchor="middle">mm de pluie par an</text><text x="270" y="240" font-size="12.5" fill="#f4eee4" text-anchor="middle">besoin général du caféier</text><rect x="520" y="80" width="610" height="240" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="825" y="130" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Le besoin réel dépend de</text><text x="680" y="180" font-size="13" fill="#63706a" text-anchor="middle">rétention</text><text x="680" y="200" font-size="13" fill="#63706a" text-anchor="middle">du sol</text><text x="825" y="180" font-size="13" fill="#63706a" text-anchor="middle">humidité</text><text x="825" y="200" font-size="13" fill="#63706a" text-anchor="middle">de l'air</text><text x="970" y="180" font-size="13" fill="#63706a" text-anchor="middle">nébulosité</text><text x="825" y="252" font-size="13" fill="#63706a" text-anchor="middle">et les pratiques culturales</text></g><text x="600" y="360" font-family="Arial, sans-serif" font-size="13" fill="#63706a" text-anchor="middle">Repères du manuel FAO de culture du café.</text></svg>
