<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Diagnostiquer une tasse : tendances mesurées par l'UC Davis</title><desc id="desc">Tableau de lecture. L'amertume augmente avec la force et avec le rendement. L'acidité augmente avec la force mais diminue quand le rendement augmente. La douceur diminue avec les deux. En pratique : une tasse très acide correspond plutôt à un faible rendement, une tasse très amère à un rendement élevé.</desc><rect width="1200" height="470" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><text x="70" y="64" font-size="22" fill="#294b3b" font-weight="700">Ce que les dégustateurs entraînés ont mesuré</text><text x="70" y="92" font-size="14" fill="#63706a">Essais sensoriels UC Davis Coffee Center, torréfaction moyenne — tendances statistiques</text><rect x="70" y="120" width="336" height="180" rx="18" fill="#fffaf2" stroke="#d9d4cf" stroke-width="2"/><text x="238" y="164" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle">Amertume</text><text x="238" y="204" font-size="14" fill="#63706a" text-anchor="middle">force ↑ → amertume ↑</text><text x="238" y="230" font-size="14" fill="#63706a" text-anchor="middle">rendement ↑ → amertume ↑</text><rect x="432" y="120" width="336" height="180" rx="18" fill="#fffaf2" stroke="#d9d4cf" stroke-width="2"/><text x="600" y="164" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle">Acidité (sourness)</text><text x="600" y="204" font-size="14" fill="#63706a" text-anchor="middle">force ↑ → acidité ↑</text><text x="600" y="230" font-size="14" fill="#63706a" text-anchor="middle">rendement ↑ → acidité ↓</text><rect x="794" y="120" width="336" height="180" rx="18" fill="#fffaf2" stroke="#d9d4cf" stroke-width="2"/><text x="962" y="164" font-size="17" fill="#294b3b" font-weight="700" text-anchor="middle">Douceur naturelle</text><text x="962" y="204" font-size="14" fill="#63706a" text-anchor="middle">force ↑ → douceur ↓</text><text x="962" y="230" font-size="14" fill="#63706a" text-anchor="middle">rendement ↑ → douceur ↓</text><rect x="70" y="330" width="510" height="100" rx="18" fill="#294b3b"/><text x="325" y="372" font-size="15.5" fill="#fffaf2" font-weight="700" text-anchor="middle">Tasse très acide ?</text><text x="325" y="400" font-size="14" fill="#fffaf2" text-anchor="middle">plutôt un faible rendement d'extraction</text><rect x="620" y="330" width="510" height="100" rx="18" fill="#9c5b35"/><text x="875" y="372" font-size="15.5" fill="#fffaf2" font-weight="700" text-anchor="middle">Tasse très amère ?</text><text x="875" y="400" font-size="14" fill="#fffaf2" text-anchor="middle">plutôt un rendement d'extraction élevé</text></g></svg>
