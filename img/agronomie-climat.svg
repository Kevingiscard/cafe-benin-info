<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Climat du café : zone tropicale, températures et pluie</title><desc id="desc">Le café se cultive entre 25 degrés nord et 25 degrés sud ; 15 à 24 degrés pour l’arabica, 24 à 30 pour le robusta, 1500 à 3000 mm de pluie par an.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="60" y="70" width="470" height="270" rx="20" fill="#fffaf2" stroke="#294b3b" stroke-width="3"/><rect x="80" y="140" width="430" height="130" rx="10" fill="#9c5b35" opacity="0.28"/><line x1="80" y1="140" x2="510" y2="140" stroke="#9c5b35" stroke-width="3" stroke-dasharray="8 6"/><line x1="80" y1="270" x2="510" y2="270" stroke="#9c5b35" stroke-width="3" stroke-dasharray="8 6"/><line x1="80" y1="205" x2="510" y2="205" stroke="#294b3b" stroke-width="3"/><text x="524" y="145" font-size="14" fill="#9c5b35" font-weight="700" text-anchor="start" >25° N</text><text x="524" y="275" font-size="14" fill="#9c5b35" font-weight="700" text-anchor="start" >25° S</text><text x="524" y="210" font-size="13" fill="#294b3b" font-weight="400" text-anchor="start" >équateur</text><text x="295" y="110" font-size="16" fill="#294b3b" font-weight="700" text-anchor="middle" >Zone de culture du café</text><text x="295" y="310" font-size="14" fill="#63706a" font-weight="400" text-anchor="middle" >entre 25° nord et 25° sud</text><rect x="620" y="70" width="165" height="270" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="702" y="130" font-size="18" fill="#294b3b" font-weight="700" text-anchor="middle" >Arabica</text><text x="702" y="185" font-size="17" fill="#9c5b35" font-weight="700" text-anchor="middle" >15–24 °C</text><text x="702" y="222" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle" >meilleurs</text><text x="702" y="240" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle" >résultats en</text><text x="702" y="258" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle" >altitude</text><rect x="800" y="70" width="165" height="270" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="882" y="130" font-size="18" fill="#294b3b" font-weight="700" text-anchor="middle" >Robusta</text><text x="882" y="185" font-size="17" fill="#9c5b35" font-weight="700" text-anchor="middle" >24–30 °C</text><text x="882" y="222" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle" >du niveau de la</text><text x="882" y="240" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle" >mer à ~800 m</text><rect x="980" y="70" width="165" height="270" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="1062" y="130" font-size="18" fill="#294b3b" font-weight="700" text-anchor="middle" >Pluie</text><text x="1062" y="185" font-size="17" fill="#9c5b35" font-weight="700" text-anchor="middle" >1 500–3 000 mm/an</text><text x="1062" y="222" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle" >selon sol,</text><text x="1062" y="240" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle" >humidité et</text><text x="1062" y="258" font-size="12.5" fill="#63706a" font-weight="400" text-anchor="middle" >pratiques</text><text x="600" y="378" font-size="13" fill="#63706a" font-weight="400" text-anchor="middle" >Repères FAO (manuel du café) — valeurs générales, les conditions locales varient.</text></g></svg>
