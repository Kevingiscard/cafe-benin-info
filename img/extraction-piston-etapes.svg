<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Piston : la recette du module ROCC en cinq étapes</title><desc id="desc">Étapes : 1, rincer et préchauffer la cafetière. 2, doser au ratio 1 pour 15, par exemple 26 g de café pour 400 ml d'eau. 3, verser un tiers de l'eau pour mouiller tout le café, puis le reste. 4, attendre 4 minutes. 5, presser le piston lentement.</desc><rect width="1200" height="430" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="60" y="70" width="200" height="250" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="160" cy="120" r="26" fill="#294b3b"/><text x="160" y="129" font-size="19" fill="#fffaf2" font-weight="700" text-anchor="middle">1</text><text x="160" y="180" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Préchauffer</text><text x="160" y="206" font-size="12.5" fill="#63706a" text-anchor="middle">cafetière rincée</text><text x="160" y="226" font-size="12.5" fill="#63706a" text-anchor="middle">et préchauffée</text><rect x="280" y="70" width="200" height="250" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="380" cy="120" r="26" fill="#294b3b"/><text x="380" y="129" font-size="19" fill="#fffaf2" font-weight="700" text-anchor="middle">2</text><text x="380" y="180" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Doser 1:15</text><text x="380" y="206" font-size="12.5" fill="#63706a" text-anchor="middle">26 g pour 400 ml</text><text x="380" y="226" font-size="12.5" fill="#63706a" text-anchor="middle">ou 55 g pour 950 ml</text><rect x="500" y="70" width="200" height="250" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="600" cy="120" r="26" fill="#294b3b"/><text x="600" y="129" font-size="19" fill="#fffaf2" font-weight="700" text-anchor="middle">3</text><text x="600" y="180" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Mouiller</text><text x="600" y="206" font-size="12.5" fill="#63706a" text-anchor="middle">un tiers de l'eau,</text><text x="600" y="226" font-size="12.5" fill="#63706a" text-anchor="middle">puis le reste</text><rect x="720" y="70" width="200" height="250" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="820" cy="120" r="26" fill="#294b3b"/><text x="820" y="129" font-size="19" fill="#fffaf2" font-weight="700" text-anchor="middle">4</text><text x="820" y="180" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Attendre</text><text x="820" y="206" font-size="12.5" fill="#63706a" text-anchor="middle">4 minutes</text><text x="820" y="226" font-size="12.5" fill="#63706a" text-anchor="middle">d'immersion</text><rect x="940" y="70" width="200" height="250" rx="18" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="1040" cy="120" r="26" fill="#294b3b"/><text x="1040" y="129" font-size="19" fill="#fffaf2" font-weight="700" text-anchor="middle">5</text><text x="1040" y="180" font-size="15" fill="#294b3b" font-weight="700" text-anchor="middle">Presser</text><text x="1040" y="206" font-size="12.5" fill="#63706a" text-anchor="middle">piston lent,</text><text x="1040" y="226" font-size="12.5" fill="#63706a" text-anchor="middle">le filtre retient le marc</text><text x="600" y="380" font-size="13" fill="#63706a" text-anchor="middle">Recette d'un module de formation SCA (ROCC), pas une norme — le ratio 1:15 diffère du repère 1:18 cité pour le filtre.</text></g></svg>
