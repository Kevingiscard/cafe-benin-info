<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Espresso : la définition historique et les pratiques réelles</title><desc id="desc">Deux colonnes comparées. Définition SCAA : 7 à 9 g de café, 25 à 35 ml, 90,5 à 96,1 degrés, 9 à 10 atmosphères, 20 à 30 secondes. Pratiques des baristas en 2017 : ratio moyen 1 pour 2, 18 à 20 g pour environ 36,5 g de boisson, 25 à 30 secondes pour 51 pour cent des répondants, 9 bars le plus souvent.</desc><rect width="1200" height="430" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="60" width="510" height="300" rx="20" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="110" y="112" font-size="19" fill="#294b3b" font-weight="700">Définition historique SCAA</text><text x="110" y="138" font-size="12.5" fill="#63706a">republiée par la SCA</text><text x="110" y="180" font-size="15" fill="#63706a">Café</text><text x="480" y="180" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">7–9 g</text><text x="110" y="212" font-size="15" fill="#63706a">Boisson</text><text x="480" y="212" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">25–35 ml</text><text x="110" y="244" font-size="15" fill="#63706a">Eau</text><text x="480" y="244" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">90,5–96,1 °C</text><text x="110" y="276" font-size="15" fill="#63706a">Pression</text><text x="480" y="276" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">9–10 atm</text><text x="110" y="308" font-size="15" fill="#63706a">Temps</text><text x="480" y="308" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">20–30 s</text><rect x="620" y="60" width="510" height="300" rx="20" fill="#fffaf2" stroke="#294b3b" stroke-width="3"/><text x="660" y="112" font-size="19" fill="#294b3b" font-weight="700">Pratiques réelles (enquête 2017)</text><text x="660" y="138" font-size="12.5" fill="#63706a">Barista Guild of America, baristas du monde entier</text><text x="660" y="180" font-size="15" fill="#63706a">Ratio moyen</text><text x="1090" y="180" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">1:2 (1:1,5–1:2,5)</text><text x="660" y="212" font-size="15" fill="#63706a">Recette</text><text x="1090" y="212" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">18–20 g → ≈ 36,5 g</text><text x="660" y="244" font-size="15" fill="#63706a">Temps le plus cité</text><text x="1090" y="244" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">25–30 s (51 %)</text><text x="660" y="276" font-size="15" fill="#63706a">Pression la plus fréquente</text><text x="1090" y="276" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="end">9 bars</text><text x="660" y="318" font-size="12.5" fill="#63706a">La pratique a resserré le ratio autour de 1:2.</text></g></svg>
