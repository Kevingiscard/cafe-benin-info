<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Prix de référence OIC, octobre 2026</title><desc id="desc">Moyennes mensuelles de l'indicateur composite de l'OIC et de ses groupes en cents US par livre, octobre 2026 : composite 261,26 ; Colombian Milds 357,85 ; Other Milds 334,99 ; Brazilian Naturals 294,49 ; Robustas 164,19. Les stocks certifiés d'arabica américains sont à 0,23 million de sacs, plus bas niveau de fin de mois depuis janvier 2002.</desc><rect width="1200" height="460" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><text x="70" y="60" font-size="14" fill="#294b3b" font-weight="700">Cents US par livre, moyennes d'octobre 2026 (OIC)</text><text x="70" y="108" font-size="13" fill="#294b3b">Colombian Milds</text><rect x="330" y="92" width="600" height="26" rx="8" fill="#294b3b"/><text x="942" y="111" font-size="13" fill="#294b3b" font-weight="700">357,85</text><text x="70" y="150" font-size="13" fill="#294b3b">Other Milds</text><rect x="330" y="134" width="561" height="26" rx="8" fill="#294b3b"/><text x="903" y="153" font-size="13" fill="#294b3b" font-weight="700">334,99</text><text x="70" y="192" font-size="13" fill="#294b3b">Brazilian Naturals</text><rect x="330" y="176" width="494" height="26" rx="8" fill="#294b3b"/><text x="836" y="195" font-size="13" fill="#294b3b" font-weight="700">294,49</text><text x="70" y="234" font-size="13" fill="#294b3b">I-CIP (composite)</text><rect x="330" y="218" width="438" height="26" rx="8" fill="#9c5b35"/><text x="780" y="237" font-size="13" fill="#9c5b35" font-weight="700">261,26</text><text x="70" y="276" font-size="13" fill="#294b3b">Robustas</text><rect x="330" y="260" width="275" height="26" rx="8" fill="#63706a"/><text x="617" y="279" font-size="13" fill="#63706a" font-weight="700">164,19</text><rect x="70" y="310" width="1060" height="86" rx="14" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="90" y="345" font-size="13" fill="#294b3b" font-weight="700">Contexte du mois</text><text x="90" y="372" font-size="12.5" fill="#63706a">Hausse des arabicas, baisse des robustas. Stocks certifiés d'arabica américains : 0,23 M de sacs, plus bas niveau de fin de mois depuis janvier 2002.</text></g><text x="600" y="436" font-family="Arial, sans-serif" font-size="12.5" fill="#63706a" text-anchor="middle">Groupes de cafés verts négociés sur les marchés internationaux. Source : rapport mensuel de l'OIC, octobre 2026.</text></svg>
