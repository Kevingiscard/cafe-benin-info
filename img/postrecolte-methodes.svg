<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Trois méthodes de transformation du café</title><desc id="desc">Naturelle : séchage de la cerise entière. Semi-lavée : dépulpage puis démucilage mécanique. Lavée : dépulpage, fermentation, lavage puis séchage.</desc><rect width="1200" height="470" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="40" y="58" width="150" height="52" rx="14" fill="#294b3b"/><text x="115" y="91" font-size="16" fill="#fffaf2" font-weight="700" text-anchor="middle">Naturelle</text><rect x="225" y="58" width="170" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="310.0" y="91" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Cerise entière</text><path d="M399 84 h22 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="429" y="58" width="190" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="524.0" y="91" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Séchage du fruit</text><path d="M623 84 h22 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="653" y="58" width="160" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="733.0" y="91" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Décorticage</text><path d="M818 84 h27 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="853" y="58" width="165" height="52" rx="26" fill="#496e5a" stroke="#496e5a" stroke-width="3"/><text x="935.5" y="91" font-size="12.5" fill="#fffaf2" font-weight="700" text-anchor="middle">Café vert 12 %</text><rect x="40" y="178" width="150" height="52" rx="14" fill="#294b3b"/><text x="115" y="211" font-size="16" fill="#fffaf2" font-weight="700" text-anchor="middle">Semi-lavée</text><rect x="225" y="178" width="150" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="300.0" y="211" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Dépulpage</text><path d="M379 204 h22 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="409" y="178" width="215" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="516.5" y="211" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Démucilage mécanique</text><path d="M628 204 h22 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="658" y="178" width="140" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="728.0" y="211" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Séchage</text><path d="M803 204 h27 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="838" y="178" width="165" height="52" rx="26" fill="#496e5a" stroke="#496e5a" stroke-width="3"/><text x="920.5" y="211" font-size="12.5" fill="#fffaf2" font-weight="700" text-anchor="middle">Café vert 12 %</text><rect x="40" y="298" width="150" height="52" rx="14" fill="#294b3b"/><text x="115" y="331" font-size="16" fill="#fffaf2" font-weight="700" text-anchor="middle">Lavée</text><rect x="225" y="298" width="150" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="300.0" y="331" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Dépulpage</text><path d="M379 324 h22 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="409" y="298" width="195" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="506.5" y="331" font-size="13" fill="#294b3b" font-weight="700" text-anchor="middle">Fermentation 1–2 j</text><path d="M608 324 h22 l-12 -8 m12 8 -12 8" stroke="#294b3b" stroke-width="3" fill="none"/><rect x="638" y="298" width="130" height="52" rx="26" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><text x="703.0" y="331" font-size="13" fill="#294b3b" font-w