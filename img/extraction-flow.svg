<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Diagnostic d’extraction du café</title><desc id="desc">Un chemin de diagnostic relie goût, variables et action : aigre, amer, faible ou plat.</desc><rect width="1200" height="420" rx="28" fill="#eef3ed"/><g font-family="Arial, sans-serif"><g fill="#294b3b" font-size="27" font-weight="700"><text x="60" y="68">Goûter</text><text x="360" y="68">Nommer le signal</text><text x="710" y="68">Changer une variable</text><text x="1030" y="68">Regoûter</text></g><g fill="#fffaf2" stroke="#9c5b35" stroke-width="4"><rect x="60" y="112" width="210" height="210" rx="22"/><rect x="360" y="112" width="260" height="210" rx="22"/><rect x="710" y="112" width="240" height="210" rx="22"/><rect x="1030" y="112" width="120" height="210" rx="22"/></g><g fill="#9c5b35" font-size="23"><text x="165" y="170" text-anchor="middle">Tasse</text><text x="165" y="210" text-anchor="middle">texture</text><text x="165" y="246" text-anchor="middle">arôme</text><text x="165" y="282" text-anchor="middle">finale</text><text x="490" y="170" text-anchor="middle">trop aigre ?</text><text x="490" y="210" text-anchor="middle">trop amer ?</text><text x="490" y="250" text-anchor="middle">trop faible ?</text><text x="490" y="290" text-anchor="middle">trop plat ?</text><text x="830" y="170" text-anchor="middle">mouture</text><text x="830" y="210" text-anchor="middle">ratio</text><text x="830" y="250" text-anchor="middle">temps</text><text x="830" y="290" text-anchor="middle">température</text><text x="1090" y="218" text-anchor="middle">une seule</text><text x="1090" y="254" text-anchor="middle">variable</text></g><g stroke="#294b3b" stroke-width="4" fill="none"><path d="M270 217h70l-16-12m16 12-16 12M620 217h70l-16-12m16 12-16 12M950 217h60l-16-12m16 12-16 12"/></g></g></svg>
