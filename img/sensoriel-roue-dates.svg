<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">La roue des arômes : deux dates repères</title><desc id="desc">Frise : en 1995, publication de la Coffee Taster's Flavor Wheel. En 2016, mise à jour en collaboration avec World Coffee Research. Le Laboratoire du site propose une version interactive.</desc><rect width="1200" height="400" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><text x="70" y="70" font-size="22" fill="#294b3b" font-weight="700">Une roue, deux générations</text><line x1="140" y1="210" x2="1060" y2="210" stroke="#9c5b35" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="210" r="16" fill="#294b3b"/><text x="300" y="158" font-size="20" fill="#9c5b35" font-weight="700" text-anchor="middle">1995</text><text x="300" y="258" font-size="14" fill="#63706a" text-anchor="middle">Publication de la</text><text x="300" y="280" font-size="14" fill="#63706a" text-anchor="middle">Coffee Taster's Flavor Wheel</text><circle cx="720" cy="210" r="16" fill="#294b3b"/><text x="720" y="158" font-size="20" fill="#9c5b35" font-weight="700" text-anchor="middle">2016</text><text x="720" y="258" font-size="14" fill="#63706a" text-anchor="middle">Mise à jour avec</text><text x="720" y="280" font-size="14" fill="#63706a" text-anchor="middle">World Coffee Research</text><rect x="890" y="150" width="240" height="120" rx="16" fill="#294b3b"/><text x="1010" y="196" font-size="14.5" fill="#fffaf2" font-weight="700" text-anchor="middle">À explorer :</text><text x="1010" y="222" font-size="13.5" fill="#fffaf2" text-anchor="middle">la roue interactive</text><text x="1010" y="244" font-size="13.5" fill="#fffaf2" text-anchor="middle">du Laboratoire</text><text x="70" y="356" font-size="13" fill="#63706a">La roue classe les arômes du café, des familles générales vers les descripteurs précis.</text></g></svg>
