<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Quatre méthodes de préparation comparées</title><desc id="desc">Espresso : 7 à 9 g pour 25 à 35 ml, 9 à 10 bars, 20 à 30 secondes. Filtre : environ 55 g par litre, eau à 93 degrés. Piston : ratio 1 pour 15, 4 minutes. Moka : environ 1,5 bar, feu doux.</desc><rect width="1200" height="430" rx="28" fill="#f4eee4"/><g font-family="Arial, sans-serif"><rect x="70" y="60" width="520" height="130" rx="20" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="122" cy="125" r="30" fill="#294b3b"/><text x="122" y="134" font-size="20" fill="#fffaf2" font-weight="700" text-anchor="middle" >1</text><text x="170" y="112" font-size="19" fill="#294b3b" font-weight="700" text-anchor="start" >Espresso</text><text x="170" y="140" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="start" >7–9 g · 25–35 ml</text><text x="170" y="162" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >9–10 bar · 20–30 s</text><text x="575" y="182" font-size="11.5" fill="#63706a" font-weight="400" text-anchor="end" >définition SCAA/SCA</text><rect x="630" y="60" width="520" height="130" rx="20" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="682" cy="125" r="30" fill="#294b3b"/><text x="682" y="134" font-size="20" fill="#fffaf2" font-weight="700" text-anchor="middle" >2</text><text x="730" y="112" font-size="19" fill="#294b3b" font-weight="700" text-anchor="start" >Filtre</text><text x="730" y="140" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="start" >≈55 g/L · 1:16–1:18</text><text x="730" y="162" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >eau 93 °C ± 3</text><text x="1135" y="182" font-size="11.5" fill="#63706a" font-weight="400" text-anchor="end" >repère Golden Cup</text><rect x="70" y="220" width="520" height="130" rx="20" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="122" cy="285" r="30" fill="#294b3b"/><text x="122" y="294" font-size="20" fill="#fffaf2" font-weight="700" text-anchor="middle" >3</text><text x="170" y="272" font-size="19" fill="#294b3b" font-weight="700" text-anchor="start" >Piston</text><text x="170" y="300" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="start" >1:15 · 4 minutes</text><text x="170" y="322" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >pression lente</text><text x="575" y="342" font-size="11.5" fill="#63706a" font-weight="400" text-anchor="end" >recette ROCC (SCA)</text><rect x="630" y="220" width="520" height="130" rx="20" fill="#fffaf2" stroke="#9c5b35" stroke-width="3"/><circle cx="682" cy="285" r="30" fill="#294b3b"/><text x="682" y="294" font-size="20" fill="#fffaf2" font-weight="700" text-anchor="middle" >4</text><text x="730" y="272" font-size="19" fill="#294b3b" font-weight="700" text-anchor="start" >Moka</text><text x="730" y="300" font-size="15" fill="#9c5b35" font-weight="700" text-anchor="start" >≈1,5 bar · feu doux</text><text x="730" y="322" font-size="13.5" fill="#63706a" font-weight="400" text-anchor="start" >mouture &gt; espresso</text><text x="1135" y="342" font-size="11.5" fill="#63706a" font-weight="400" text-anchor="end" >conseils Bialetti</text><text x="600" y="412" font-size="13" fill="#63706a" font-weight="400" text-anchor="middle" >Repères issus des sources citées du chapitre ; ce ne sont pas des normes universelles et les pratiques varient.</text></g></svg>
