name: Deploy Café Bénin to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# La publication est faite par le workflow intégré « pages build and deployment »
# (Settings → Pages → Deploy from a branch, main, racine). Ce workflow ne fait que valider :
# un second déploiement en parallèle entrait en conflit avec la publication réelle.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate site
        run: npm run verify
