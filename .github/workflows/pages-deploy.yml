name: Validate Café Bénin

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ce workflow exécute uniquement les contrôles qualité du dépôt.
# Il ne publie ni sur GitHub Pages ni sur Tencent EdgeOne.
# La publication publique EdgeOne est configurée séparément dans la console Tencent.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate site
        run: npm run verify
