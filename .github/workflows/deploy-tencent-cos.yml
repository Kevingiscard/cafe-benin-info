name: Deploy Café Bénin to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-cos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
      TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.COS_BUCKET }}
      COS_REGION: ${{ secrets.COS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate site
        run: npm run verify

      - name: Prepare static deployment directory
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='api/' \
            --exclude='dist/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='README*' \
            --exclude='DEPLOYMENT_STATUS.md' \
            --exclude='content-sources.md' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.editorconfig'

      - name: Check Tencent credentials
        id: cos
        shell: bash
        run: |
          missing=0
          for name in TENCENT_CLOUD_SECRET_ID TENCENT_CLOUD_SECRET_KEY COS_BUCKET COS_REGION; do
            if [ -z "${!name}" ]; then
              echo "::warning::GitHub Secret $name is not configured; Tencent COS upload is skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload website to Tencent COS
        if: steps.cos.outputs.configured == 'true'
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: ${{ secrets.COS_REGION }}
          local_path: dist
          remote_path: /
          clean: false

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ steps.cos.outputs.configured }}" = "true" ]; then
            echo "Tencent COS upload completed. Verify the public custom domain and cache behavior."
          else
            echo "Validation completed, but COS deployment is pending GitHub repository secrets."
          fi
